<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memo — Receipts & Notes</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #111827;
            --muted: #9ca3af;
            --text: #e5e7eb;
            --accent: #60a5fa;
            --accent2: #34d399;
            --danger: #f87171;
            --chip: #1f2937;
            --border: #1f2937;
            --overlay: rgba(0, 0, 0, .72);
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text)
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(180deg, rgba(15, 23, 42, .95), rgba(15, 23, 42, .85));
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--border)
        }

        .bar {
            max-width: 1100px;
            margin: auto;
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 16px
        }

        .brand {
            font-weight: 700;
            letter-spacing: .2px
        }

        .spacer {
            flex: 1
        }

        select,
        input[type="text"],
        input[type="date"] {
            background: #0b1222;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 10px;
            outline: none
        }

        button {
            background: #182235;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer
        }

        button.primary {
            background: var(--accent);
            border-color: #1e40af;
            color: #001a36
        }

        button.ghost {
            background: transparent
        }

        button.danger {
            background: #2a1313;
            border-color: #3b0e0e;
            color: #fecaca
        }

        main {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 16px
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--chip);
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            border: 1px solid var(--border)
        }

        .chip button {
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            padding: 0 2px
        }

        .feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .thumbs {
            display: flex;
            gap: 6px;
            overflow: hidden
        }

        .thumbs .twrap {
            position: relative
        }

        .thumbs img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: zoom-in;
            display: block
        }

        .thumbs .more {
            width: 72px;
            height: 72px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0b1222;
            display: grid;
            place-items: center;
            font-weight: 600;
            cursor: pointer
        }

        .muted {
            color: var(--muted);
            font-size: 12px
        }

        .tagsline {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .tagpill {
            font-size: 11px;
            background: #0b1222;
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 999px;
            color: #cbd5e1
        }

        .floating {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 20
        }

        .fab {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 28px;
            background: var(--accent);
            border: none;
            color: #001a36;
            box-shadow: 0 10px 18px rgba(0, 0, 0, .35);
            cursor: pointer
        }

        dialog {
            border: none;
            border-radius: 18px;
            max-width: 900px;
            width: 92vw;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 16px 44px rgba(0, 0, 0, .5)
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, .45);
        }

        .modal {
            background: var(--card);
            color: var(--text)
        }

        .modal header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background: #0b1222
        }

        .modal .content {
            padding: 16px;
            display: grid;
            gap: 14px
        }

        .row {
            display: grid;
            gap: 8px
        }

        textarea {
            width: 100%;
            min-height: 100px;
            background: #0b1222;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            padding: 10px;
            resize: vertical
        }

        .rowgrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .inline {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .suggest {
            position: relative
        }

        .dropdown {
            position: absolute;
            top: 36px;
            left: 0;
            right: 0;
            max-height: 260px;
            overflow: auto;
            background: #0b1222;
            border: 1px solid var(--border);
            border-radius: 10px;
            z-index: 30
        }

        .dropitem {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #0e1628;
            display: flex;
            justify-content: space-between;
            gap: 10px
        }

        .dropitem:last-child {
            border-bottom: none
        }

        .dropitem:hover,
        .dropitem.active {
            background: #15213a
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: #0b1222
        }

        .hidden {
            display: none
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .hint {
            font-size: 12px;
            color: #93c5fd
        }

        .grid {
            display: grid;
            gap: 10px
        }

        /* drag grid */
        .draggrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px
        }

        .dragitem {
            position: relative;
            border: 1px dashed var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: #0b1222
        }

        .dragitem img {
            display: block;
            width: 100%;
            height: 110px;
            object-fit: cover;
            user-select: none;
            pointer-events: none
        }

        .dragitem .handle {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, .5);
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 11px;
            cursor: grab
        }

        .dragitem.dragging .handle {
            cursor: grabbing
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: var(--overlay);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            touch-action: none
        }

        .lightbox.open {
            display: flex
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 86vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
            cursor: grab;
            user-select: none;
            touch-action: none;
            transform-origin: 0 0;
            will-change: transform
        }

        .lbbtn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(17, 24, 39, .9);
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer
        }

        .lbprev {
            left: 16px
        }

        .lbnext {
            right: 16px
        }

        .lbclose {
            position: absolute;
            top: 16px;
            right: 16px;
            transform: none
        }

        .lbcounter {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 24, 39, .9);
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            font-size: 12px
        }

        /* Filters & Tag Manager */
        .filters .row {
            grid-template-columns: 1fr
        }

        .pill {
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: #0b1222;
            cursor: pointer
        }

        .scroll {
            max-height: 220px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            background: #0b1222
        }

        .linkbtn {
            background: #0b1222;
            border: 1px solid var(--border);
            color: #93c5fd;
            border-radius: 10px;
            padding: 6px 10px;
            cursor: pointer
        }

        .tagmgr-wrap {
            max-height: 280px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            background: #0b1222
        }

        .tagmgr-list {
            display: grid;
            gap: 8px
        }

        .tagrow {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 8px;
            align-items: center
        }

        .tagrow input[type=text] {
            background: #0b1222;
            border: 1px solid var(--border);
            color: #e5e7eb;
            padding: 6px 8px;
            border-radius: 10px
        }

        .tagrow .count {
            color: #93c5fd;
            font-size: 12px;
            text-align: right
        }

        /* Calendar dialog */
        .calwrap {
            min-width: 320px;
        }

        .calbar {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px
        }

        .calbar .left,
        .calbar .right {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .calgrid {
            display: grid;
            gap: 6px
        }

        .calgrid.year {
            grid-template-columns: repeat(4, 1fr)
        }

        .calgrid.month {
            grid-template-columns: repeat(7, 1fr)
        }

        .calgrid.day {
            grid-template-columns: 1fr
        }

        .calcell {
            border: 1px solid var(--border);
            background: #0b1222;
            border-radius: 10px;
            padding: 10px;
            min-height: 56px;
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        .calcell.small {
            min-height: 48px;
            padding: 8px
        }

        .calcell .title {
            font-weight: 600;
            font-size: 12px;
            color: #cbd5e1
        }

        .calcell .count {
            position: absolute;
            bottom: 8px;
            right: 10px;
            font-size: 12px;
            color: #9ca3af
        }

        .calcell.disabled {
            opacity: .4;
            pointer-events: none
        }

        .calcell.hasData {
            background: #0d1a33
        }

        .calcell.noData {
            background: #0b1222
        }

        .calcell.inRange {
            outline: 2px solid var(--accent)
        }

        .calcell.rangeEdge {
            outline: 2px solid var(--accent2)
        }

        .callegend {
            display: flex;
            gap: 10px;
            align-items: center;
            color: #93c5fd;
            font-size: 12px
        }

        /* day view hourly table */
        .hourrow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
            background: #0b1222;
            padding: 8px 10px;
            border-radius: 10px
        }

        .hourrow+.hourrow {
            margin-top: 6px
        }

        .hourrow .label {
            font-variant-numeric: tabular-nums;
            color: #cbd5e1
        }

        .hourrow .badge {
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: #182235;
            font-size: 12px
        }

        .hourrow.morning {
            background: #0d1f35
        }

        .hourrow.afternoon {
            background: #0f243d
        }

        .hourrow.evening {
            background: #0f1d2e
        }

        .hourrow.night {
            background: #0b1524
        }

        /* top action row */
        .calactions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px
        }

        /* Hourly grid (day view): 4 rows × 6 columns */
        .calgrid.day {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .hourcell {
            border: 1px solid var(--border);
            background: #0b1222;
            border-radius: 10px;
            padding: 8px 10px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-variant-numeric: tabular-nums;
        }

        .hourcell .label {
            color: #cbd5e1
        }

        .hourcell .badge {
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: #182235;
            font-size: 12px
        }

        .hourcell.morning {
            background: #0d1f35
        }

        .hourcell.afternoon {
            background: #0f243d
        }

        .hourcell.evening {
            background: #0f1d2e
        }

        .hourcell.night {
            background: #0b1524
        }



        /* Red indicator on Filters button when filters are active */
        #filtersBtn.filter-active {
            position: relative;
            border-color: #7f1d1d;
            box-shadow: 0 0 0 1px rgba(127, 29, 29, .35) inset;
        }

        #filtersBtn.filter-active::after {
            content: "";
            position: absolute;
            top: -3px;
            right: -3px;
            width: 10px;
            height: 10px;
            background: var(--danger);
            border: 2px solid #0b1222;
            /* ring matches toolbar bg */
            border-radius: 50%;
        }

        /* make it comfy on phones too */
        @media (max-width:720px) {
            .calgrid.year {
                grid-template-columns: repeat(3, 1fr)
            }

            .calgrid.month {
                gap: 4px
            }

            .calcell {
                min-height: 48px
            }
        }

        /* Make calendar able to go even narrower on phones */
        .calwrap {
            min-width: 280px;
        }

        /* was 320px */
        @media (max-width: 540px) {
            .calgrid.year {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 420px) {
            .calgrid.year {
                grid-template-columns: repeat(2, 1fr);
            }

            .calgrid.month {
                gap: 3px;
            }

            .calcell {
                min-height: 42px;
                padding: 6px;
                border-radius: 8px;
            }

            .calcell .title {
                font-size: 11px;
            }

            .calcell .count {
                font-size: 11px;
            }

            .callegend {
                font-size: 11px;
                gap: 8px;
            }
        }

        /* ===== Responsive polish ===== */
        /* 1) Let the top bar wrap nicely on narrow screens */
        @media (max-width: 720px) {
            .bar {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px 8px;
                align-items: center;
            }

            .brand {
                grid-column: 1 / -1;
            }

            .spacer {
                display: none;
            }

            /* stack filters neatly */
            #categoryFilter,
            #searchBox,
            #filtersBtn,
            #chooseDirBtn {
                width: 100%;
            }

            /* move "Choose Folder" (or File menu if you add it) to full width */
        }

        /* 2) Feed grid: denser on large screens, flexible on phones */
        @media (max-width: 720px) {
            .feed {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 12px;
            }

            .thumbs img,
            .thumbs .more {
                width: 64px;
                height: 64px;
            }
        }

        /* 3) Dialogs/forms: switch to single-column, full-width inputs on phones */
        @media (max-width: 720px) {
            dialog {
                width: 96vw;
                max-width: 96vw;
                border-radius: 14px;
            }

            .modal .content {
                padding: 14px;
                gap: 12px;
            }

            .rowgrid {
                grid-template-columns: 1fr;
            }

            .inline {
                gap: 6px;
            }

            textarea {
                min-height: 120px;
            }

            /* tag dropdown stays above keyboard area */
            .suggest .dropdown {
                top: auto;
                bottom: -2px;
                transform: translateY(100%);
                max-height: 40vh;
            }
        }

        /* 4) Drag grid thumbnails: fit more on small screens */
        @media (max-width: 720px) {
            .draggrid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 8px;
            }

            .dragitem img {
                height: 90px;
            }

            .dragitem .handle {
                font-size: 10px;
                padding: 2px 5px;
            }
        }

        /* 5) Lightbox: bigger touch targets + edge safe areas on phones */
        @media (max-width: 720px) {
            .lightbox img {
                max-width: 94vw;
                max-height: 80vh;
            }

            .lbbtn {
                padding: 12px 14px;
                /* easier to tap */
                border-radius: 12px;
            }

            .lbprev {
                left: 10px;
            }

            .lbnext {
                right: 10px;
            }

            .lbclose {
                top: 10px;
                right: 10px;
            }

            .lbcounter {
                bottom: 10px;
            }
        }

        /* 6) Make buttons & inputs a hair taller for touch */
        @media (pointer: coarse) {

            button,
            select,
            input[type="text"],
            input[type="date"] {
                min-height: 42px;
            }
        }

        /* 7) Prevent header from overflowing on mid-width screens */
        @media (min-width: 721px) and (max-width: 980px) {
            .bar {
                display: grid;
                grid-template-columns: auto 1fr auto auto auto;
                gap: 8px;
            }

            #searchBox {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="bar">
            <div class="brand">🗂️ Memo</div>
            <div class="spacer"></div>
            <select id="categoryFilter">
                <option value="__ALL__">All categories</option>
            </select>
            <input id="searchBox" type="text" placeholder="Search description / tags…" />
            <button id="filtersBtn" title="More filters">Filters</button>
            <button id="calendarBtn" title="Open calendar">Calendar</button>
            <button id="chooseDirBtn" title="Choose a folder to save images & memo.json">Choose Folder</button>
        </div>
    </header>
    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button class="lbbtn lbclose" id="lbClose">Close ✕</button>
        <button class="lbbtn lbprev" id="lbPrev">◀</button>
        <!-- prevent native drag: -->
        <img id="lbImg" alt="preview" draggable="false" />
        <button class="lbbtn lbnext" id="lbNext">▶</button>
        <div class="lbcounter" id="lbCounter">1/1</div>
    </div>

    <main>
        <section class="toolbar">
            <div class="hint">Optional file saving is <span id="fsStatus">disabled</span>. <span class="muted">Without it, everything stays in your browser.</span></div>
        </section>
        <section class="feed" id="feed"></section>
    </main>

    <div class="floating">
        <button class="fab" id="fab" title="New entry">+</button>
    </div>

    <!-- Create/Edit Modal -->
    <dialog id="entryDlg">
        <div class="modal">
            <header><strong id="dlgTitle">New Entry</strong></header>
            <div class="content">
                <div class="row">
                    <label for="desc">Description</label>
                    <textarea id="desc" placeholder="What is this receipt/memo about?"></textarea>
                </div>
                <div class="rowgrid">
                    <div class="row">
                        <label for="categoryInput">Category</label>
                        <div class="inline">
                            <select id="categoryInput"></select>
                            <input id="newCategory" type="text" placeholder="or type new…" />
                            <button id="addCategoryBtn">Add</button>
                        </div>
                        <div class="muted">Tip: Type a new category and press Enter to add.</div>
                    </div>
                    <div class="row">
                        <label for="images">Images</label>
                        <input id="images" type="file" accept="image/*" multiple />
                        <div class="muted">Drag thumbnails below to reorder.</div>
                    </div>
                </div>
                <div class="row">
                    <label>Tags</label>
                    <div class="suggest">
                        <input id="tagInput" type="text" placeholder="Type to search tags; Enter/click to add" autocomplete="off" />
                        <div class="dropdown hidden" id="tagDropdown"></div>
                    </div>
                    <div class="chips" id="tagChips"></div>
                </div>
                <div class="row">
                    <label>Images order</label>
                    <div class="draggrid" id="dragGrid"></div>
                </div>
            </div>
            <div class="actions">
                <span class="spacer"></span>
                <button class="ghost" id="cancelBtn">Cancel</button>
                <button class="primary" id="saveBtn">Post</button>
            </div>
        </div>
    </dialog>

    <!-- Detail Modal -->
    <dialog id="detailDlg">
        <div class="modal">
            <header><strong>Entry</strong></header>
            <div class="content" id="detailContent"></div>
            <div class="actions">
                <button class="danger" id="deleteBtn">Delete</button>
                <span class="spacer"></span>
                <button id="editBtn">Edit</button>
                <button class="ghost" id="closeDetailBtn">Close</button>
            </div>
        </div>
    </dialog>

    <!-- Filters / Tag Manager -->
    <dialog id="filtersDlg">
        <div class="modal filters">
            <header><strong>Filters</strong></header>
            <div class="content">
                <div class="row">
                    <label>Filter by category</label>
                    <div id="filterCategoryPills" class="chips"></div>
                </div>
                <div class="row">
                    <label>Filter by tags</label>
                    <input id="filterTagInput" type="text" placeholder="Start typing tag to filter…" />
                    <div id="filterTagPills" class="chips"></div>
                </div>
                <div class="row">
                    <label>Filter by date range</label>
                    <div class="inline">
                        <input id="filterDateStart" type="date" />
                        <span>to</span>
                        <input id="filterDateEnd" type="date" />
                    </div>
                </div>
                <div class="row">
                    <label>Manage tags</label>
                    <div class="inline">
                        <button id="manageTagsBtn" class="linkbtn">Open Tag Manager</button>
                    </div>

    <script>
        // Use a flag to switch between local storage and server backend
        const USE_SERVER_BACKEND = true; // This will be set by the Python backend

        // A simple class to manage memos,
        // it acts as the "model" in our pseudo-MVC architecture.
        // It handles data storage and retrieval, either locally or from a server.
        class MemoService {
            constructor() {
                this.isServerBackend = USE_SERVER_BACKEND;
                if (!this.isServerBackend) {
                    console.log("Using browser's localStorage for data persistence.");
                } else {
                    console.log("Using server backend for data persistence.");
                }
            }

            async getMemos() {
                if (this.isServerBackend) {
                    try {
                        const response = await fetch('/api/memos');
                        if (!response.ok) {
                            throw new Error('Failed to fetch memos from server.');
                        }
                        const data = await response.json();
                        // For demonstration, map server IDs to our internal structure if needed
                        return data.map(memo => ({
                            ...memo,
                            id: memo.id,
                            tags: memo.tags || [],
                            images: memo.images || [],
                            date: new Date(memo.date || memo.createdAt)
                        }));
                    } catch (error) {
                        console.error('Error fetching memos:', error);
                        return [];
                    }
                } else {
                    // Local storage fallback
                    const storedMemos = JSON.parse(localStorage.getItem('memos') || '[]');
                    return storedMemos.map(memo => ({
                        ...memo,
                        date: new Date(memo.date)
                    }));
                }
            }

            async addMemo(memo) {
                if (this.isServerBackend) {
                    try {
                        const response = await fetch('/api/memos', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...memo, date: memo.date.toISOString() })
                        });
                        if (!response.ok) {
                            throw new Error('Failed to add memo to server.');
                        }
                        const newMemo = await response.json();
                        return newMemo;
                    } catch (error) {
                        console.error('Error adding memo:', error);
                        return null;
                    }
                } else {
                    // Local storage fallback
                    const memos = await this.getMemos();
                    const newId = memos.length > 0 ? Math.max(...memos.map(m => m.id)) + 1 : 1;
                    const newMemo = { ...memo, id: newId };
                    memos.push(newMemo);
                    localStorage.setItem('memos', JSON.stringify(memos));
                    return newMemo;
                }
            }

            async updateMemo(id, memo) {
                if (this.isServerBackend) {
                    try {
                        const response = await fetch(`/api/memos/${id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...memo, date: memo.date.toISOString() })
                        });
                        if (!response.ok) {
                            throw new Error('Failed to update memo on server.');
                        }
                        const updatedMemo = await response.json();
                        return updatedMemo;
                    } catch (error) {
                        console.error('Error updating memo:', error);
                        return null;
                    }
                } else {
                    // Local storage fallback
                    const memos = await this.getMemos();
                    const index = memos.findIndex(m => m.id === id);
                    if (index !== -1) {
                        memos[index] = { ...memos[index], ...memo };
                        localStorage.setItem('memos', JSON.stringify(memos));
                        return memos[index];
                    }
                    return null;
                }
            }

            async deleteMemo(id) {
                if (this.isServerBackend) {
                    try {
                        const response = await fetch(`/api/memos/${id}`, {
                            method: 'DELETE'
                        });
                        if (!response.ok) {
                            throw new Error('Failed to delete memo from server.');
                        }
                        return true;
                    } catch (error) {
                        console.error('Error deleting memo:', error);
                        return false;
                    }
                } else {
                    // Local storage fallback
                    const memos = await this.getMemos();
                    const newMemos = memos.filter(m => m.id !== id);
                    localStorage.setItem('memos', JSON.stringify(newMemos));
                    return true;
                }
            }

            async uploadImage(file) {
                if (this.isServerBackend) {
                    const formData = new FormData();
                    formData.append('file', file);
                    try {
                        const response = await fetch('/api/upload', {
                            method: 'POST',
                            body: formData
                        });
                        if (!response.ok) {
                            throw new Error('Image upload failed.');
                        }
                        const result = await response.json();
                        return result.url;
                    } catch (error) {
                        console.error('Error uploading image:', error);
                        return null;
                    }
                } else {
                    // Local storage fallback: convert to data URL
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = e => resolve(e.target.result);
                        reader.onerror = e => reject(e);
                        reader.readAsDataURL(file);
                    });
                }
            }
        }

        // --- View & Controller Logic (your original HTML + JS) ---

        // The following is the original JS from your HTML file, with
        // modifications to use the MemoService class for data operations.

        const memoService = new MemoService();

        // -----------------------
        // --- DOM Elements & State ---
        // -----------------------
        const els = {
            feed: document.getElementById('feed'),
            fab: document.getElementById('fab'),
            entryDlg: document.getElementById('entryDlg'),
            dlgTitle: document.getElementById('dlgTitle'),
            desc: document.getElementById('desc'),
            categoryInput: document.getElementById('categoryInput'),
            newCategory: document.getElementById('newCategory'),
            addCategoryBtn: document.getElementById('addCategoryBtn'),
            images: document.getElementById('images'),
            dragGrid: document.getElementById('dragGrid'),
            tagInput: document.getElementById('tagInput'),
            tagDropdown: document.getElementById('tagDropdown'),
            tagChips: document.getElementById('tagChips'),
            cancelBtn: document.getElementById('cancelBtn'),
            saveBtn: document.getElementById('saveBtn'),
            detailDlg: document.getElementById('detailDlg'),
            detailContent: document.getElementById('detailContent'),
            deleteBtn: document.getElementById('deleteBtn'),
            editBtn: document.getElementById('editBtn'),
            closeDetailBtn: document.getElementById('closeDetailBtn'),
            lightbox: document.getElementById('lightbox'),
            lbImg: document.getElementById('lbImg'),
            lbPrev: document.getElementById('lbPrev'),
            lbNext: document.getElementById('lbNext'),
            lbClose: document.getElementById('lbClose'),
            lbCounter: document.getElementById('lbCounter'),
            categoryFilter: document.getElementById('categoryFilter'),
            searchBox: document.getElementById('searchBox'),
            filtersBtn: document.getElementById('filtersBtn'),
            filtersDlg: document.getElementById('filtersDlg'),
            filterCategoryPills: document.getElementById('filterCategoryPills'),
            filterTagInput: document.getElementById('filterTagInput'),
            filterTagPills: document.getElementById('filterTagPills'),
            filterDateStart: document.getElementById('filterDateStart'),
            filterDateEnd: document.getElementById('filterDateEnd'),
            clearFiltersBtn: document.getElementById('clearFiltersBtn'),
            applyFiltersBtn: document.getElementById('applyFiltersBtn'),
            manageTagsBtn: document.getElementById('manageTagsBtn'),
            manageTagsDlg: document.getElementById('manageTagsDlg'),
            tagmgrList: document.getElementById('tagmgr-list'),
            newTagInput: document.getElementById('newTagInput'),
            addNewTagBtn: document.getElementById('addNewTagBtn'),
            closeTagMgrBtn: document.getElementById('closeTagMgrBtn'),
            calendarBtn: document.getElementById('calendarBtn'),
            calendarDlg: document.getElementById('calendarDlg'),
            calPrev: document.getElementById('calPrev'),
            calNext: document.getElementById('calNext'),
            calDrill: document.getElementById('calDrill'),
            calTitle: document.getElementById('calTitle'),
            calendarGrid: document.getElementById('calendarGrid'),
            calClearSel: document.getElementById('calClearSel'),
            calApply: document.getElementById('calApply'),
            fsStatus: document.getElementById('fsStatus'),
            chooseDirBtn: document.getElementById('chooseDirBtn'),
        };

        let memos = [];
        let categories = new Set();
        let tags = new Set();
        let currentEditingMemoId = null;
        let selectedImages = [];
        let filterState = {
            category: '__ALL__',
            search: '',
            tags: new Set(),
            dateStart: null,
            dateEnd: null
        };
        let lightboxState = {
            open: false,
            currentIndex: 0,
            images: []
        };
        let tagMgrState = {
            allTags: new Set(),
            memoCounts: {}
        };
        let calState = {
            pivot: new Date(), // currently displayed month/year
            view: 'month', // 'day', 'month', 'year'
            rangeStart: null,
            rangeEnd: null,
            parentView: null
        };

        // -----------------------
        // --- File System Access (optional) ---
        // -----------------------
        const fs = {
            isSupported: 'showDirectoryPicker' in window,
            rootHandle: null,
            fileUrls: {}
        };

        if (fs.isSupported) {
            els.fsStatus.textContent = 'enabled';
            els.chooseDirBtn.style.display = 'inline-block';
        } else {
            els.fsStatus.textContent = 'disabled';
            els.chooseDirBtn.style.display = 'none';
        }

        async function saveMemosToFile() {
            if (!fs.rootHandle) return;
            try {
                const memoJsonFile = await fs.rootHandle.getFileHandle('memos.json', { create: true });
                const writable = await memoJsonFile.createWritable();
                const memosToSave = memos.map(m => {
                    const { id, description, category, tags, images, date } = m;
                    return {
                        id,
                        description,
                        category,
                        tags,
                        images: images.map(img => {
                            return img.name;
                        }),
                        date: date.toISOString()
                    };
                });
                await writable.write(JSON.stringify(memosToSave, null, 2));
                await writable.close();
                console.log('Memos saved to memos.json');
            } catch (err) {
                console.error('Failed to save memos to file system:', err);
                alert('Failed to save memos. See console for details.');
            }
        }

        async function loadMemosFromFile() {
            if (!fs.rootHandle) return;
            try {
                const memoJsonFile = await fs.rootHandle.getFileHandle('memos.json');
                const file = await memoJsonFile.getFile();
                const content = await file.text();
                const loadedMemos = JSON.parse(content);
                memos = loadedMemos.map(m => {
                    return {
                        ...m,
                        date: new Date(m.date),
                        images: m.images.map(imgName => {
                            const url = fs.fileUrls[imgName];
                            return url ? { name: imgName, url: url } : { name: imgName, url: '' };
                        })
                    };
                });
                updateUI();
                console.log('Memos loaded from memos.json');
            } catch (err) {
                if (err.name === 'NotFoundError') {
                    console.warn('memos.json not found, starting fresh.');
                } else {
                    console.error('Failed to load memos from file system:', err);
                    alert('Failed to load memos. See console for details.');
                }
            }
        }

        async function loadImagesFromFile() {
            if (!fs.rootHandle) return;
            fs.fileUrls = {};
            for await (const entry of fs.rootHandle.values()) {
                if (entry.kind === 'file' && entry.name.match(/\.(jpg|jpeg|png|gif)$/i)) {
                    const file = await entry.getFile();
                    const url = URL.createObjectURL(file);
                    fs.fileUrls[entry.name] = url;
                }
            }
        }


        // -----------------------
        // --- Data & UI Functions ---
        // -----------------------

        async function init() {
            // Wait for memos to load from the server or local storage
            memos = await memoService.getMemos();
            // Load tags from memos and update tag manager state
            updateTagsState();
            // Update the UI with the initial data
            updateUI();
        }

        function updateTagsState() {
            tagMgrState.allTags.clear();
            tagMgrState.memoCounts = {};
            const tagSet = new Set();
            for (const memo of memos) {
                for (const tag of memo.tags) {
                    tagSet.add(tag);
                    tagMgrState.memoCounts[tag] = (tagMgrState.memoCounts[tag] || 0) + 1;
                }
            }
            tagMgrState.allTags = new Set([...tagSet].sort());
        }

        function updateUI() {
            const filteredMemos = applyFilters();
            renderFeed(filteredMemos);
            renderCategoryFilter(memos);
            renderFilterPills();
            renderTagManager();
        }

        function renderFeed(filteredMemos) {
            els.feed.innerHTML = '';
            if (filteredMemos.length === 0) {
                els.feed.innerHTML = '<p class="muted" style="text-align: center;">No memos found. Add a new entry to get started.</p>';
                return;
            }

            filteredMemos.forEach(memo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = memo.id;
                card.innerHTML = `
                    <div class="muted">${new Date(memo.date).toLocaleDateString()}</div>
                    <div>${memo.description}</div>
                    <div class="tagsline">${memo.tags.map(tag => `<span class="tagpill">${tag}</span>`).join('')}</div>
                    ${renderImageThumbnails(memo.images)}
                `;
                card.addEventListener('click', () => openDetailDialog(memo));
                els.feed.appendChild(card);
            });
        }

        function renderImageThumbnails(images) {
            if (images.length === 0) return '';
            const thumbsHtml = images.slice(0, 3).map((img, i) => `
                <div class="twrap" data-index="${i}">
                    <img src="${img.url || img}" alt="thumbnail" />
                </div>
            `).join('');
            const moreHtml = images.length > 3 ? `<div class="more">+${images.length - 3}</div>` : '';
            return `<div class="thumbs">${thumbsHtml}${moreHtml}</div>`;
        }

        function renderCategoryFilter(memos) {
            const categories = new Set(memos.map(m => m.category));
            const options = ['__ALL__', ...Array.from(categories).sort()].map(cat =>
                `<option value="${cat}">${cat === '__ALL__' ? 'All categories' : cat}</option>`
            ).join('');
            els.categoryInput.innerHTML = options;
            els.categoryFilter.innerHTML = options;
        }

        function renderFilterPills() {
            els.filterCategoryPills.innerHTML = '';
            els.filterTagPills.innerHTML = '';

            if (filterState.category !== '__ALL__') {
                els.filterCategoryPills.innerHTML = createPill(filterState.category, 'category');
            }
            if (filterState.tags.size > 0) {
                filterState.tags.forEach(tag => {
                    els.filterTagPills.appendChild(createPill(tag, 'tag'));
                });
            }

            if (filterState.category !== '__ALL__' || filterState.tags.size > 0 || filterState.dateStart || filterState.dateEnd) {
                els.filtersBtn.classList.add('filter-active');
            } else {
                els.filtersBtn.classList.remove('filter-active');
            }
        }

        function createPill(text, type) {
            const pill = document.createElement('div');
            pill.className = 'pill';
            pill.textContent = text;
            pill.addEventListener('click', () => {
                if (type === 'category') {
                    filterState.category = '__ALL__';
                } else if (type === 'tag') {
                    filterState.tags.delete(text);
                }
                updateUI();
            });
            return pill;
        }

        function renderTagManager() {
            els.tagmgrList.innerHTML = '';
            const allTags = [...tagMgrState.allTags].sort();
            allTags.forEach(tag => {
                const count = tagMgrState.memoCounts[tag] || 0;
                const tagRow = document.createElement('div');
                tagRow.className = 'tagrow';
                tagRow.innerHTML = `
                    <input type="text" value="${tag}" readonly />
                    <div class="count">${count}</div>
                    <button class="ghost rename-tag-btn" data-tag="${tag}">✎</button>
                    <button class="ghost danger remove-tag-btn" data-tag="${tag}">✕</button>
                `;
                els.tagmgrList.appendChild(tagRow);
            });
        }

        function applyFilters() {
            return memos.filter(memo => {
                const categoryMatch = filterState.category === '__ALL__' || memo.category === filterState.category;
                const searchMatch = memo.description.toLowerCase().includes(filterState.search.toLowerCase()) || memo.tags.some(tag => tag.toLowerCase().includes(filterState.search.toLowerCase()));
                const tagsMatch = [...filterState.tags].every(tag => memo.tags.includes(tag));
                const dateMatch = (!filterState.dateStart || memo.date >= filterState.dateStart) && (!filterState.dateEnd || memo.date <= filterState.dateEnd);
                return categoryMatch && searchMatch && tagsMatch && dateMatch;
            }).sort((a, b) => b.date - a.date);
        }

        // -----------------------
        // --- Dialogs & Event Handlers ---
        // -----------------------

        function openEntryDialog(memo = null) {
            currentEditingMemoId = memo ? memo.id : null;
            els.dlgTitle.textContent = memo ? 'Edit Entry' : 'New Entry';
            els.desc.value = memo ? memo.description : '';
            els.categoryInput.value = memo ? memo.category : '';
            els.tagChips.innerHTML = '';
            selectedImages = [];
            els.dragGrid.innerHTML = '';

            if (memo) {
                memo.tags.forEach(tag => addTagChip(tag));
                selectedImages = memo.images;
                renderDragGrid();
            }

            els.entryDlg.showModal();
        }

        function closeEntryDialog() {
            els.entryDlg.close();
            // Clear inputs
            els.desc.value = '';
            els.newCategory.value = '';
            els.tagInput.value = '';
            els.images.value = null;
            els.tagChips.innerHTML = '';
            els.dragGrid.innerHTML = '';
        }

        async function openDetailDialog(memo) {
            els.detailContent.innerHTML = `
                <div class="row">
                    <div class="muted">${new Date(memo.date).toLocaleDateString()}</div>
                    <h3>${memo.description}</h3>
                </div>
                <div class="row">
                    <div class="muted">Category: <span class="tagpill">${memo.category}</span></div>
                    <div class="muted">Tags: <div class="tagsline">${memo.tags.map(tag => `<span class="tagpill">${tag}</span>`).join('')}</div></div>
                </div>
                <div class="row">
                    ${renderDetailImages(memo.images)}
                </div>
            `;
            els.deleteBtn.dataset.id = memo.id;
            els.editBtn.dataset.id = memo.id;
            els.detailDlg.showModal();
        }

        function renderDetailImages(images) {
            if (images.length === 0) return '';
            const thumbsHtml = images.map((img, i) => `
                <div class="twrap" data-index="${i}">
                    <img src="${img.url || img}" alt="memo image" />
                </div>
            `).join('');
            return `<div class="thumbs" id="detailImages">${thumbsHtml}</div>`;
        }

        async function handleSave() {
            const description = els.desc.value;
            const category = els.categoryInput.value || els.newCategory.value;
            const tags = Array.from(els.tagChips.children).map(chip => chip.textContent.trim());
            const images = [...selectedImages];

            // Handle image uploads
            const newImages = [...els.images.files];
            for (const file of newImages) {
                const url = await memoService.uploadImage(file);
                if (url) {
                    images.push({ name: file.name, url: url });
                }
            }

            if (!description) {
                alert('Description is required!');
                return;
            }

            const newMemo = {
                description,
                category,
                tags,
                images,
                date: new Date()
            };

            let result;
            if (currentEditingMemoId) {
                result = await memoService.updateMemo(currentEditingMemoId, newMemo);
            } else {
                result = await memoService.addMemo(newMemo);
            }

            if (result) {
                memos = await memoService.getMemos();
                updateTagsState();
                updateUI();
                closeEntryDialog();
            } else {
                alert('Failed to save memo. Check the console for errors.');
            }
        }

        function addTagChip(tag) {
            if (tag === '') return;
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML = `
                <span>${tag}</span>
                <button>✕</button>
            `;
            chip.querySelector('button').addEventListener('click', () => {
                chip.remove();
            });
            els.tagChips.appendChild(chip);
        }

        function openLightbox(images, index) {
            lightboxState.images = images;
            lightboxState.currentIndex = index;
            lightboxState.open = true;
            els.lbImg.src = images[index].url || images[index];
            updateLightboxCounter();
            els.lightbox.classList.add('open');
            els.lightbox.setAttribute('aria-hidden', 'false');
        }

        function closeLightbox() {
            lightboxState.open = false;
            els.lightbox.classList.remove('open');
            els.lightbox.setAttribute('aria-hidden', 'true');
        }

        function showNextImage() {
            let nextIndex = (lightboxState.currentIndex + 1) % lightboxState.images.length;
            if (nextIndex < 0) nextIndex += lightboxState.images.length; // wrap around
            lightboxState.currentIndex = nextIndex;
            els.lbImg.src = lightboxState.images[nextIndex].url || lightboxState.images[nextIndex];
            updateLightboxCounter();
        }

        function showPrevImage() {
            let prevIndex = (lightboxState.currentIndex - 1 + lightboxState.images.length) % lightboxState.images.length;
            if (prevIndex < 0) prevIndex += lightboxState.images.length; // wrap around
            lightboxState.currentIndex = prevIndex;
            els.lbImg.src = lightboxState.images[prevIndex].url || lightboxState.images[prevIndex];
            updateLightboxCounter();
        }

        function updateLightboxCounter() {
            els.lbCounter.textContent = `${lightboxState.currentIndex + 1}/${lightboxState.images.length}`;
        }

        function renderDragGrid() {
            els.dragGrid.innerHTML = '';
            selectedImages.forEach((img, i) => {
                const dragItem = document.createElement('div');
                dragItem.className = 'dragitem';
                dragItem.draggable = true;
                dragItem.dataset.index = i;
                dragItem.innerHTML = `<div class="handle">☰</div><img src="${img.url || img}" alt="memo image" />`;
                els.dragGrid.appendChild(dragItem);
            });
        }

        function handleDragStart(e) {
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', e.target.dataset.index);
        }

        function handleDragOver(e) {
            e.preventDefault();
            const draggingEl = document.querySelector('.dragging');
            const targetEl = e.target.closest('.dragitem');
            if (draggingEl && targetEl && draggingEl !== targetEl) {
                const targetIndex = parseInt(targetEl.dataset.index);
                const draggingIndex = parseInt(draggingEl.dataset.index);
                const parent = targetEl.parentNode;
                if (draggingIndex < targetIndex) {
                    parent.insertBefore(draggingEl, targetEl.nextSibling);
                } else {
                    parent.insertBefore(draggingEl, targetEl);
                }
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            const draggingEl = document.querySelector('.dragging');
            draggingEl.classList.remove('dragging');
            const newOrder = Array.from(els.dragGrid.children).map(el =>
                selectedImages[parseInt(el.dataset.index)]
            );
            selectedImages = newOrder;
            renderDragGrid();
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function openFiltersDialog() {
            els.categoryFilter.value = filterState.category;
            els.searchBox.value = filterState.search;
            els.filterTagInput.value = '';
            els.filterDateStart.value = filterState.dateStart ? filterState.dateStart.toISOString().split('T')[0] : '';
            els.filterDateEnd.value = filterState.dateEnd ? filterState.dateEnd.toISOString().split('T')[0] : '';

            renderFilterPills();
            els.filtersDlg.showModal();
        }

        function applyFiltersFromDialog() {
            filterState.category = els.categoryFilter.value;
            filterState.search = els.searchBox.value;
            filterState.dateStart = els.filterDateStart.value ? new Date(els.filterDateStart.value) : null;
            filterState.dateEnd = els.filterDateEnd.value ? new Date(els.filterDateEnd.value) : null;
            els.filtersDlg.close();
            updateUI();
        }

        function clearFilters() {
            filterState = {
                category: '__ALL__',
                search: '',
                tags: new Set(),
                dateStart: null,
                dateEnd: null
            };
            els.filtersDlg.close();
            updateUI();
        }

        function openTagManagerDialog() {
            renderTagManager();
            els.manageTagsDlg.showModal();
        }

        function addNewTag() {
            const newTag = els.newTagInput.value.trim();
            if (newTag) {
                tagMgrState.allTags.add(newTag);
                tagMgrState.memoCounts[newTag] = 0;
                renderTagManager();
                els.newTagInput.value = '';
            }
        }

        function openCalendarDialog() {
            calState.pivot = new Date();
            calState.view = 'month';
            calState.parentView = null;
            calState.rangeStart = null;
            calState.rangeEnd = null;
            renderCalendar();
            els.calendarDlg.showModal();
        }

        function renderCalendar() {
            els.calTitle.textContent = getCalendarTitle(calState.pivot, calState.view);
            els.calendarGrid.className = `calgrid ${calState.view}`;
            els.calDrill.disabled = !calState.rangeStart || (calState.view === 'day' || (calState.view === 'month' && !calState.rangeStart.hasTime));

            els.calendarGrid.innerHTML = '';

            const memosByDate = getMemosByDate();

            if (calState.view === 'year') {
                for (let i = 0; i < 12; i++) {
                    const monthDate = new Date(calState.pivot.getFullYear(), i, 1);
                    const monthData = getMonthData(monthDate);
                    els.calendarGrid.appendChild(createCalendarCell('month', monthDate, monthData, memosByDate));
                }
            } else if (calState.view === 'month') {
                const daysInMonth = new Date(calState.pivot.getFullYear(), calState.pivot.getMonth() + 1, 0).getDate();
                const startDay = new Date(calState.pivot.getFullYear(), calState.pivot.getMonth(), 1).getDay();

                const weekDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                weekDays.forEach(day => {
                    const cell = document.createElement('div');
                    cell.className = 'calcell small muted';
                    cell.textContent = day;
                    cell.style.cursor = 'default';
                    cell.style.minHeight = 'auto';
                    els.calendarGrid.appendChild(cell);
                });

                for (let i = 0; i < startDay; i++) {
                    els.calendarGrid.appendChild(createEmptyCalendarCell());
                }

                for (let i = 1; i <= daysInMonth; i++) {
                    const date = new Date(calState.pivot.getFullYear(), calState.pivot.getMonth(), i);
                    const dayData = memosByDate[date.toISOString().split('T')[0]] || { count: 0, hasData: false };
                    els.calendarGrid.appendChild(createCalendarCell('day', date, dayData));
                }
            } else if (calState.view === 'day') {
                const date = calState.pivot;
                const dailyMemos = memos.filter(m => {
                    const memoDate = new Date(m.date);
                    return memoDate.getFullYear() === date.getFullYear() && memoDate.getMonth() === date.getMonth() && memoDate.getDate() === date.getDate();
                }).sort((a,b) => a.date - b.date);

                if (dailyMemos.length === 0) {
                    const p = document.createElement('p');
                    p.className = 'muted';
                    p.textContent = 'No memos for this day.';
                    els.calendarGrid.appendChild(p);
                } else {
                    dailyMemos.forEach(memo => {
                        const cell = document.createElement('div');
                        cell.className = 'calcell';
                        cell.innerHTML = `
                            <div class="muted">${new Date(memo.date).toLocaleTimeString()}</div>
                            <div class="title">${memo.description}</div>
                        `;
                        cell.addEventListener('click', () => {
                            openDetailDialog(memo);
                            els.calendarDlg.close();
                        });
                        els.calendarGrid.appendChild(cell);
                    });
                }
            }
        }

        function getMemosByDate() {
            const memosByDate = {};
            memos.forEach(memo => {
                const dateKey = memo.date.toISOString().split('T')[0];
                if (!memosByDate[dateKey]) {
                    memosByDate[dateKey] = { count: 0, hasData: true };
                }
                memosByDate[dateKey].count++;
            });
            return memosByDate;
        }

        function createCalendarCell(view, date, data) {
            const cell = document.createElement('div');
            cell.className = `calcell`;
            if (view === 'month') {
                cell.classList.add('small');
            }
            cell.classList.toggle('hasData', data.hasData);
            cell.classList.toggle('noData', !data.hasData);

            const isStart = calState.rangeStart && date.getFullYear() === calState.rangeStart.getFullYear() && date.getMonth() === calState.rangeStart.getMonth() && date.getDate() === calState.rangeStart.getDate();
            const isEnd = calState.rangeEnd && date.getFullYear() === calState.rangeEnd.getFullYear() && date.getMonth() === calState.rangeEnd.getMonth() && date.getDate() === calState.rangeEnd.getDate();
            const inRange = calState.rangeStart && calState.rangeEnd && date >= calState.rangeStart && date <= calState.rangeEnd;
            cell.classList.toggle('rangeEdge', isStart || isEnd);
            cell.classList.toggle('inRange', inRange);

            const title = view === 'year' ? date.toLocaleString('default', { month: 'short' }) : date.getDate();
            cell.innerHTML = `<div class="title">${title}</div>`;
            if (data.count > 0) {
                cell.innerHTML += `<div class="count">${data.count}</div>`;
            }

            cell.addEventListener('click', () => {
                if (view === 'year') {
                    calState.parentView = 'year';
                    calState.view = 'month';
                    calState.pivot = date;
                    renderCalendar();
                } else if (view === 'month') {
                    calState.parentView = 'month';
                    calState.view = 'day';
                    calState.pivot = date;
                    renderCalendar();
                } else if (view === 'day') {
                    handleDateSelection(date);
                }
            });
            return cell;
        }

        function handleDateSelection(date) {
            if (!calState.rangeStart) {
                calState.rangeStart = date;
            } else if (!calState.rangeEnd) {
                if (date > calState.rangeStart) {
                    calState.rangeEnd = date;
                } else {
                    calState.rangeEnd = calState.rangeStart;
                    calState.rangeStart = date;
                }
            } else {
                calState.rangeStart = date;
                calState.rangeEnd = null;
            }
            renderCalendar();
        }

        function createEmptyCalendarCell() {
            const cell = document.createElement('div');
            cell.className = 'calcell small disabled';
            return cell;
        }

        function getCalendarTitle(date, view) {
            if (view === 'year') {
                return date.getFullYear();
            } else if (view === 'month') {
                return date.toLocaleString('default', { month: 'long', year: 'numeric' });
            } else if (view === 'day') {
                return date.toDateString();
            }
        }

        // -----------------------
        // --- Event Listeners ---
        // -----------------------
        els.fab.addEventListener('click', () => openEntryDialog());
        els.cancelBtn.addEventListener('click', () => closeEntryDialog());
        els.saveBtn.addEventListener('click', handleSave);
        els.images.addEventListener('change', () => {
            const files = Array.from(els.images.files);
            selectedImages = selectedImages.concat(files);
            renderDragGrid();
        });
        els.dragGrid.addEventListener('dragstart', handleDragStart);
        els.dragGrid.addEventListener('dragover', handleDragOver);
        els.dragGrid.addEventListener('drop', handleDrop);
        els.dragGrid.addEventListener('dragend', handleDragEnd);
        els.closeDetailBtn.addEventListener('click', () => els.detailDlg.close());
        els.deleteBtn.addEventListener('click', async (e) => {
            const memoId = parseInt(e.target.dataset.id);
            if (confirm('Are you sure you want to delete this memo?')) {
                const success = await memoService.deleteMemo(memoId);
                if (success) {
                    memos = await memoService.getMemos();
                    updateTagsState();
                    updateUI();
                    els.detailDlg.close();
                } else {
                    alert('Failed to delete memo. Check the console for errors.');
                }
            }
        });
        els.editBtn.addEventListener('click', (e) => {
            const memoId = parseInt(e.target.dataset.id);
            const memo = memos.find(m => m.id === memoId);
            if (memo) {
                closeDetailDialog();
                openEntryDialog(memo);
            }
        });
        els.detailContent.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                const index = parseInt(e.target.closest('.twrap').dataset.index);
                const memoId = parseInt(e.target.closest('.card').dataset.id);
                const memo = memos.find(m => m.id === memoId);
                if (memo) {
                    openLightbox(memo.images, index);
                }
            }
        });
        els.lbClose.addEventListener('click', closeLightbox);
        els.lbPrev.addEventListener('click', showPrevImage);
        els.lbNext.addEventListener('click', showNextImage);
        els.lightbox.addEventListener('click', (e) => {
            if (e.target === els.lightbox) closeLightbox();
        });
        els.searchBox.addEventListener('input', (e) => {
            filterState.search = e.target.value;
            updateUI();
        });
        els.filtersBtn.addEventListener('click', openFiltersDialog);
        els.applyFiltersBtn.addEventListener('click', applyFiltersFromDialog);
        els.clearFiltersBtn.addEventListener('click', clearFilters);
        els.manageTagsBtn.addEventListener('click', openTagManagerDialog);
        els.addNewTagBtn.addEventListener('click', addNewTag);
        els.closeTagMgrBtn.addEventListener('click', () => els.manageTagsDlg.close());
        els.tagInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            els.tagDropdown.innerHTML = '';
            els.tagDropdown.classList.add('hidden');
            if (query.length > 0) {
                const suggestions = [...tagMgrState.allTags].filter(tag => tag.toLowerCase().includes(query));
                if (suggestions.length > 0) {
                    suggestions.forEach(tag => {
                        const dropItem = document.createElement('div');
                        dropItem.className = 'dropitem';
                        dropItem.textContent = tag;
                        dropItem.addEventListener('click', () => {
                            addTagChip(tag);
                            els.tagInput.value = '';
                            els.tagDropdown.classList.add('hidden');
                        });
                        els.tagDropdown.appendChild(dropItem);
                    });
                    els.tagDropdown.classList.remove('hidden');
                }
            }
        });
        els.tagInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const tag = els.tagInput.value.trim();
                if (tag) {
                    addTagChip(tag);
                    els.tagInput.value = '';
                    els.tagDropdown.classList.add('hidden');
                }
            }
        });
        els.newCategory.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                els.addCategoryBtn.click();
            }
        });
        els.addCategoryBtn.addEventListener('click', () => {
            const newCat = els.newCategory.value.trim();
            if (newCat) {
                const newOption = document.createElement('option');
                newOption.value = newCat;
                newOption.textContent = newCat;
                els.categoryInput.appendChild(newOption);
                els.categoryInput.value = newCat;
                els.newCategory.value = '';
            }
        });
        els.tagmgrList.addEventListener('click', (e) => {
            const target = e.target;
            const tag = target.dataset.tag;
            if (target.classList.contains('remove-tag-btn')) {
                const confirmDelete = confirm(`Are you sure you want to delete the tag "${tag}"? It will be removed from all memos.`);
                if (confirmDelete) {
                    memos.forEach(memo => {
                        memo.tags = memo.tags.filter(t => t !== tag);
                    });
                    updateTagsState();
                    updateUI();
                }
            } else if (target.classList.contains('rename-tag-btn')) {
                const newTag = prompt(`Rename tag "${tag}" to:`);
                if (newTag && newTag.trim() !== tag) {
                    memos.forEach(memo => {
                        memo.tags = memos.tags.map(t => t === tag ? newTag.trim() : t);
                    });
                    updateTagsState();
                    updateUI();
                }
            }
        });
        els.calendarBtn.addEventListener('click', openCalendarDialog);
        els.calPrev.addEventListener('click', () => {
            if (calState.view === 'month') {
                calState.pivot.setMonth(calState.pivot.getMonth() - 1);
            } else if (calState.view === 'year') {
                calState.pivot.setFullYear(calState.pivot.getFullYear() - 1);
            }
            renderCalendar();
        });
        els.calNext.addEventListener('click', () => {
            if (calState.view === 'month') {
                calState.pivot.setMonth(calState.pivot.getMonth() + 1);
            } else if (calState.view === 'year') {
                calState.pivot.setFullYear(calState.pivot.getFullYear() + 1);
            }
            renderCalendar();
        });
        els.calDrill.addEventListener('click', () => {
            if (els.calDrill.disabled) return;
            if (calState.view === 'month') {
                calState.parentView = 'month';
                calState.view = 'day';
                calState.pivot = calState.rangeStart;
                renderCalendar();
            } else if (calState.view === 'year') {
                calState.parentView = 'year';
                calState.view = 'month';
                calState.pivot = calState.rangeStart;
                renderCalendar();
            }
        });
        els.calClearSel.addEventListener('click', () => {
            calState.rangeStart = null;
            calState.rangeEnd = null;
            renderCalendar();
        });
        els.calApply.addEventListener('click', () => {
            els.filtersDlg.close(); // Close filters dialog first
            els.calendarDlg.close();
            if (calState.rangeStart) {
                filterState.dateStart = calState.rangeStart;
                if (calState.rangeEnd) {
                    filterState.dateEnd = calState.rangeEnd;
                }
            }
            updateUI();
        });

        // Initial setup
        init();
    </script>
</body>
</html>
