name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pillow pypdf openai anthropic
      - run: npm ci
      - run: npx playwright install --with-deps msedge
      - run: npm run build
      - name: Storage recovery checks
        run: bash build_tools/ci-step.sh "Storage checks" npm run test:state
      - name: Server suites
        run: bash build_tools/ci-step.sh "Server suites" python tests/run_all.py --backend
      - name: Browser suite
        run: bash build_tools/ci-step.sh "Browser suite" npx playwright test --workers=2
